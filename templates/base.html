<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LogiTrack{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
        colors: {
          panel: '#111827',
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

  <div class="max-w-screen mx-auto">
    <div class="bg-white shadow-sm overflow-hidden">
      <div class="bg-slate-800 px-6 py-4 flex items-center justify-between">
        <a href="{{ url_for('index') }}" class="text-white font-mono font-bold text-xl tracking-wide">LogiTrack</a>
        {% if request.endpoint != 'index' %}
          <nav class="flex gap-4 text-sm">
            <a href="{{ url_for('operadores') }}" class="text-slate-300 hover:text-white transition">Operadores</a>
            <a href="{{ url_for('leitores') }}" class="text-slate-300 hover:text-white transition">Leitores</a>
            <a href="{{ url_for('registros') }}" class="text-slate-300 hover:text-white transition">Registros</a>
          </nav>
        {% endif %}
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="px-6 pt-4">
            {% for category, message in messages %}
              <div class="mb-2 text-sm px-3 py-2 rounded
                {% if category == 'success' %} bg-green-50 text-green-700 border border-green-200
                {% elif category == 'info' %} bg-red-50 text-red-700 border border-red-200
                {% else %} bg-slate-50 text-slate-700 border border-slate-200 {% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <div class="p-6">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var target = document.querySelector('[data-polling-target]');
      if (!target) return;

      var interval = Number(target.getAttribute('data-polling-interval')) || 5000;
      var requestInFlight = false;

      function refreshTable() {
        if (requestInFlight || document.visibilityState === 'hidden') return;
        requestInFlight = true;

        fetch(window.location.href, {
          cache: 'no-store',
          headers: { 'X-Requested-With': 'polling' }
        })
          .then(function (response) {
            if (!response.ok) throw new Error('Polling failed with HTTP ' + response.status);
            return response.text();
          })
          .then(function (html) {
            var documentParser = new DOMParser();
            var nextDocument = documentParser.parseFromString(html, 'text/html');
            var nextTarget = nextDocument.querySelector('[data-polling-target]');
            if (!nextTarget) throw new Error('Polling response did not contain the table');

            var currentTarget = document.querySelector('[data-polling-target]');
            if (currentTarget) {
              currentTarget.replaceWith(nextTarget);
              document.dispatchEvent(new CustomEvent('tableupdated'));
            }
          })
          .catch(function (error) {
            console.error('Não foi possível atualizar a tabela:', error);
          })
          .finally(function () {
            requestInFlight = false;
          });
      }

      window.setInterval(refreshTable, interval);
    })();
  </script>
</body>
</html>
